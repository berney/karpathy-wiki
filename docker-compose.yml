# Run twillm (TiddlyWiki-based wiki viewer) with a local vault.
# Live-synced: edits to vault/ from any source (LLM agent, browser, manual) are picked up immediately.
#
# Usage:
#   docker compose up          # start, foreground
#   docker compose up -d       # start, detached
#   docker compose down        # stop
#
# Exposes http://localhost:8082
# Mounts only vault/ — twillm auto-detects ./vault from its cwd.
# For a different directory (e.g. docs/wiki/), change the host mount:
#   - ./docs/wiki:/app/vault:Z

services:
  twillm:
    build: .
    ports:
      - "8082:8080"
    volumes:
      - ./vault:/app/vault:Z
