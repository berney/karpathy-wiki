# Run twillm (TiddlyWiki-based wiki viewer) with a local vault.
# Live-synced: edits to vault/ from any source (LLM agent, browser, manual) are picked up immediately.
#
# Usage:
#   docker compose up          # start, foreground
#   docker compose up -d       # start, detached
#   docker compose down        # stop
#
# Exposes http://localhost:8082 (change to avoid conflicts with other services)
# Mounts both vault/ and twillm-wiki/:
#   - vault/    contains your hand-written tiddlers (what the LLM creates)
#   - twillm-wiki/ contains generated/derived content from ingest (twillm saves here)
# For plugin persistence, also mount a custom tiddlywiki.info:
#   - ./template-wiki/tiddlywiki.info:/app/template-wiki/tiddlywiki.info:Z
# twillm auto-detects ./vault from its cwd (/app).
# For a different directory (e.g. docs/wiki/), change the host mount:
#   - ./docs/wiki:/app/vault:Z
# To switch back to building locally, uncomment "build:" and comment out "image:".
# The build context is twillm/ (where the Dockerfile lives).

services:
  twillm:
    image: ghcr.io/berney/twillm:latest
    # build: twillm                # Uncomment to build locally from ./twillm/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./vault:/app/vault:Z
      - ./twillm-wiki:/app/twillm-wiki:Z
      # Uncomment below to persist tiddlywiki.info edits (e.g. plugin additions):
      # - ./template-wiki/tiddlywiki.info:/app/template-wiki/tiddlywiki.info:Z
